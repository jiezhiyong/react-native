# 该工作流程将为每个平台创建构建，包括物理设备、Android 模拟器和 iOS 模拟器。
# 它们都将并行运行
# 使用: eas workflow:run .eas/workflows/create-development-builds.yml
name: Create development builds

jobs:
  android_development_build:
    name: Build Android
    type: build
    params:
      platform: android
      profile: development
  ios_device_development_build:
    name: Build iOS device
    type: build
    params:
      platform: ios
      profile: development
  ios_simulator_development_build:
    name: Build iOS simulator
    type: build
    params:
      platform: ios
      profile: development-simulator
