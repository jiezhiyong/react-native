---
name: 01_launch
description: 应用启动和基础UI验证测试

# 启动应用
appId: com.jiezhiyong.qachat.dev

---
# 启动应用并等待加载完成
- launchApp

# 等待应用启动完成
- extendedWaitUntil:
    visible: 'Home'
    timeout: 10000

# 验证底部 Tab 栏是否可见
- assertVisible: 'Home'
- assertVisible: 'Discover'
- assertVisible: 'Mine'

# 验证当前在 Home tab
- assertVisible:
    id: 'home-tab'

# 截图记录当前状态
- takeScreenshot: '01_app_launched.png'

# 等待一下确保UI完全加载
- waitForAnimationToEnd

# 验证主要UI元素存在
- scroll:
    direction: DOWN
    speed: 50

# 再次截图验证滚动后的状态
- takeScreenshot: '01_home_scrolled.png'
